[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exponential"
version = "0.1.0"
description = "Exponential Collective — public site and private member portal"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "pillow>=10.4",
    "pyjwt[crypto]>=2.9",
    "boto3>=1.35",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
lint.ignore = ["B008"]  # Depends() callables in signatures are the FastAPI idiom
