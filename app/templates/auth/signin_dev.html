{% extends "base.html" %}
{% block title %}Member sign-in — Exponential{% endblock %}
{% block body %}
<section class="section">
  <div class="wrap-narrow" style="max-width:460px;padding-top:40px">
    <p class="eyebrow">Member sign-in</p>
    <h1 style="font-size:32px">Sign in with email.</h1>
    <p class="muted" style="margin:14px 0 24px">We'll send a one-time code to your inbox. No password needed.</p>
    <form method="post" action="/auth/sign-in">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="f">Email</label>
      <input type="email" name="email" required autofocus>
      <div style="margin-top:22px"><button class="btn btn-accent" type="submit" style="width:100%">Send sign-in code</button></div>
    </form>
    <p class="hint" style="margin-top:18px">Not a member yet? <a href="/apply">Express interest</a>.</p>
  </div>
</section>
{% endblock %}
