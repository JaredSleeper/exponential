{% extends "base.html" %}
{% block title %}Member sign-in — Exponential{% endblock %}
{% block head %}
<script id="clerk-js" async crossorigin="anonymous"
  data-clerk-publishable-key="{{ clerk_pk }}"
  src="{{ clerk_js_url }}"></script>
{% endblock %}
{% block body %}
<section class="section">
  <div class="wrap-narrow" style="max-width:440px;padding-top:56px">
    <div id="clerk-status" class="muted" style="margin-bottom:16px">Loading sign-in…</div>
    <div id="clerk-signin"></div>
  </div>
</section>
<script>
(async () => {
  const status = document.getElementById('clerk-status');
  const signinError = sessionStorage.getItem('clerk-signin-error');
  if (signinError !== null) {
    status.textContent = signinError;
    sessionStorage.removeItem('clerk-signin-error');
  }
  try {
    if (!window.Clerk) {
      await new Promise((resolve, reject) => {
        const script = document.getElementById('clerk-js');
        script.addEventListener('load', resolve, {once: true});
        script.addEventListener('error', reject, {once: true});
      });
    }
    await Clerk.load();
    if (Clerk.session) {
      status.textContent = 'Signing you in…';
      const token = await Clerk.session.getToken();
      const resp = await fetch('/auth/clerk', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token, next: {{ next | tojson }}})
      });
      const data = await resp.json();
      if (data.ok) { location.href = data.next; return; }
      sessionStorage.setItem('clerk-signin-error', data.error || 'Sign-in failed. Try again.');
      await Clerk.signOut({redirectUrl: window.location.href});
      return;
    } else {
      if (signinError === null) status.textContent = '';
      Clerk.mountSignIn(document.getElementById('clerk-signin'), {
        fallbackRedirectUrl: window.location.href,
        signUpFallbackRedirectUrl: window.location.href,
      });
    }
  } catch (e) {
    status.textContent = 'Sign-in is unavailable right now.';
  }
})();
</script>
{% endblock %}
